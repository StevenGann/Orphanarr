name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  go:
    name: Go — vet, race, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # -race matters: the scanner is concurrent across clients and shares a
      # store with the executor (DESIGN §11.2).
      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" ./cmd/orphanarr

  corpus:
    name: Corpus — classifier specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The linter enforces that every entry justifies itself and that at
      # least a quarter of the corpus expects a negative result. A corpus of
      # only happy paths is a corpus that proves nothing.
      - name: Lint corpus
        run: python3 tests/verification/corpus_lint.py

      - name: qBittorrent contract
        run: python3 tests/verification/qbittorrent_contract_test.py

  fs-semantics:
    name: Filesystem semantics — real filesystems, not mocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mocked filesystem tests would have hidden every hazard in DESIGN
      # §6.3. These run against real filesystems and real mount namespaces.
      #
      # If a runner cannot provide what a script needs, the script exits 2
      # and THAT MUST BE VISIBLE, NOT SILENT. Do not delete these to make CI
      # green (DESIGN §10.6).
      - name: link/rename/replace/copy semantics (#C1-#C19)
        run: python3 tests/verification/fs_semantics_test.py

      - name: copy path semantics (#C20-#C34)
        run: python3 tests/verification/copy_semantics_test.py

      - name: bind-mount hardlink behaviour
        run: bash tests/verification/bindmount_hardlink_test.sh

      - name: read-only mount behaviour (#R1-#R6)
        run: bash tests/verification/readonly_mount_test.sh
