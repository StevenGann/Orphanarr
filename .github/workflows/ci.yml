name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  go:
    name: Go — vet, race, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # -race matters: the scanner is concurrent across clients and shares a
      # store with the executor (DESIGN §11.2).
      # The job is named "coverage" and must actually measure it.
      - name: go test -race -cover
        run: go test -race -count=1 -cover ./...

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o orphanarr ./cmd/orphanarr

      # The unit tests prove each package alone. This proves what only exists
      # once they are wired together — and asserts I1 against a real file
      # rather than a mock, by checksumming the source before and after a
      # full execute.
      - name: End-to-end round trip
        run: bash tests/e2e/roundtrip.sh ./orphanarr

  image:
    name: Docker — build only, no push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # amd64 only here. The release workflow builds both architectures;
      # CI only needs to know the Dockerfile still works, and building
      # arm64 on every push doubles the wait for no extra signal.
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: orphanarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds but cannot start is not a passing build. This
      # also proves CGO_ENABLED=0 actually held: a cgo-linked binary would
      # fail here against Alpine's musl.
      - name: The image starts and reports its version
        run: docker run --rm orphanarr:ci orphanarr --version

      - name: The health endpoint answers
        run: |
          docker run -d --name ci -p 8790:8790 orphanarr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/api/v1/health; then
              echo "; healthy"; docker rm -f ci; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs ci
          docker rm -f ci
          exit 1

  corpus:
    name: Corpus — classifier specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The linter enforces that every entry justifies itself and that at
      # least a quarter of the corpus expects a negative result. A corpus of
      # only happy paths is a corpus that proves nothing.
      - name: Lint corpus
        run: python3 tests/verification/corpus_lint.py

      - name: qBittorrent contract
        run: python3 tests/verification/qbittorrent_contract_test.py

  fs-semantics:
    name: Filesystem semantics — real filesystems, not mocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ubuntu 23.10+ restricts unprivileged user namespaces through
      # AppArmor, which is exactly the capability the two mount-topology
      # scripts need. Relax it so the tests actually RUN rather than skip:
      # a skipped mount test is how "st_dev equality implies linkability"
      # would have survived into the codebase.
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # Mocked filesystem tests would have hidden every hazard in DESIGN
      # §6.3. These run against real filesystems and real mount namespaces.
      - name: link/rename/replace/copy semantics (#C1-#C19)
        run: python3 tests/verification/fs_semantics_test.py

      - name: copy path semantics (#C20-#C34)
        run: python3 tests/verification/copy_semantics_test.py

      # Exit 2 means the runner cannot provide what the script needs. DESIGN
      # §10.6 requires that skip to be VISIBLE, NOT SILENT — so it becomes a
      # workflow warning annotation and the job summary records it. Any
      # other non-zero exit is a real refutation and fails the build.
      #
      # Do not "fix" a red build here by deleting the script.
      - name: bind-mount hardlink behaviour
        run: |
          set +e
          bash tests/verification/bindmount_hardlink_test.sh
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "::warning title=Mount test SKIPPED::bindmount_hardlink_test.sh could not run on this runner (exit 2). The st_dev/EXDEV claims in DESIGN §6.3 were NOT verified in this build."
            echo "- :warning: \`bindmount_hardlink_test.sh\` **skipped** — runner lacks unprivileged mount namespaces" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $rc

      - name: read-only mount behaviour (#R1-#R6)
        run: |
          set +e
          bash tests/verification/readonly_mount_test.sh
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "::warning title=Mount test SKIPPED::readonly_mount_test.sh could not run on this runner (exit 2). The :ro / EXDEV claims (#R1-#R6) were NOT verified in this build."
            echo "- :warning: \`readonly_mount_test.sh\` **skipped** — runner lacks unprivileged mount namespaces" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $rc
